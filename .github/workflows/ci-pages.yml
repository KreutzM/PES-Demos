name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Bootstrap: package-lock.json will be committed after the initial successful CI run.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Export lockfile (one-time bootstrap)
        run: |
          python3 - <<'PY'
          import base64
          with open("package-lock.json", "rb") as source:
              payload = base64.b64encode(source.read()).decode("ascii")
          for i in range(0, len(payload), 500):
              print("LOCKFILE_CHUNK:" + payload[i:i+500])
          print("LOCKFILE_DONE:" + str(len(payload)))
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Publish GitHub Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
